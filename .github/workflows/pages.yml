name: App to GitHub Pages

# Builds the app (dist/app, with view.html: the website for the team and customers' pages) and the top level that
# only forwards to it (dist/), and deploys them. Runs after CI passes on main (ci.yml calls it), or by hand.
# Nothing public is built any more: see docs/PLAN.md §11.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build app
    runs-on: ubuntu-latest
    # a newer build makes an older, unfinished one pointless
    concurrency:
      group: pages-build
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the app
        run: npx vite build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # Repository → Settings → Secrets and variables → Actions → Variables (both are safe to be public)
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      - name: The top level (forwards to the app)
        run: node scripts/build-root.mjs
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
