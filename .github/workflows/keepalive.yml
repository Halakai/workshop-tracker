name: Keep Supabase awake

# Free Supabase projects pause after about a week without activity. This pings the database
# every 3 days (public.keepalive() reads nothing). GitHub turns scheduled workflows off after
# 60 days without commits; re-enable it under Actions → Keep Supabase awake if that happens.
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the database
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$SUPABASE_URL/rest/v1/rpc/keepalive" \
            -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json" -d '{}')
          echo "keepalive: HTTP $status"
          test "$status" = "200"
